buildscript {
    repositories {
        maven { url = "https://maven.minecraftforge.net/" }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:3.+'

    }
}
apply plugin: 'net.minecraftforge.gradle'


version = "1.12.2-1.3.1"
group= "shadows.fastfurnace"
archivesBaseName = "FastFurnace"

sourceCompatibility = targetCompatibility = "1.8"
compileJava {
    sourceCompatibility = targetCompatibility = "1.8"
}

minecraft {
    mappings channel: 'stable', version: '39-1.12'
    accessTransformer = file('src/main/resources/META-INF/fastfurnace_at.cfg')
    runs{
        client{
            workingDirectory project.file('run')
        }
        server{}
    }
}

repositories {
    maven {
        url "https://dvs1.progwml6.com/files/maven"
    }
//	maven {
//		url "http://tehnut.info/maven"
//	}
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2859'
//	deobfCompile "mezz.jei:jei_1.12.2:+"
// but unused??
//	deobfCompile "mcp.mobius.waila:Hwyla:1.8+"
    compileOnly files("libs/BetterWithMods-1.12-2.3.20-1027.jar")
}

processResources
{
    inputs.property "version", project.version
    inputs.property "mcversion", "1.12.2"
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version':project.version, 'mcversion':"1.12.2"
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

jar {
    manifest {
        attributes 'FMLAT': 'fastfurnace_at.cfg'
    }
}